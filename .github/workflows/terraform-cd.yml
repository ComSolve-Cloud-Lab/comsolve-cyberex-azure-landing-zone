# ==============================================================================
# Terraform CD Pipeline
# ==============================================================================

name: Terraform CD

# ==============================================================================
# Pipeline Trigger
# ==============================================================================

on:

  push:
    branches:
      - main

# ==============================================================================
# GitHub Actions Permissions
# ==============================================================================

permissions:

  contents: read
  id-token: write

jobs:

  # ==============================================================================
  # Terraform Plan
  # ==============================================================================

  terraform-plan:

    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      # ==============================================================================
      # Checkout Repository
      # ==============================================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==============================================================================
      # Azure Login using OIDC
      # ==============================================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ==============================================================================
      # Verify Azure Authentication
      # ==============================================================================

      - name: Verify Azure Login
        run: az account show

      # ==============================================================================
      # Setup Terraform
      # ==============================================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ==============================================================================
      # Terraform Initialization
      # ==============================================================================

      - name: Terraform Init
        run: terraform init

      # ==============================================================================
      # Terraform Plan
      # ==============================================================================

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      # ==============================================================================
      # Upload Terraform Plan
      # ==============================================================================

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan


  # ==============================================================================
  # Terraform Apply
  # ==============================================================================

  terraform-apply:

    name: Terraform Apply
    runs-on: ubuntu-latest

    needs:
      - terraform-plan

    # ==============================================================================
    # Production Deployment Approval
    # ==============================================================================

    environment:
      name: Comsolve_production

    defaults:
      run:
        working-directory: terraform

    steps:

      # ==============================================================================
      # Checkout Repository
      # ==============================================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==============================================================================
      # Azure Login using OIDC
      # ==============================================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ==============================================================================
      # Verify Azure Authentication
      # ==============================================================================

      - name: Verify Azure Login
        run: az account show

      # ==============================================================================
      # Setup Terraform
      # ==============================================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ==============================================================================
      # Terraform Initialization
      # ==============================================================================

      - name: Terraform Init
        run: terraform init

      # ==============================================================================
      # Download Approved Terraform Plan
      # ==============================================================================

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      # ==============================================================================
      # Terraform Apply
      # ==============================================================================

      - name: Terraform Apply
        run: terraform apply -input=false tfplan